<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">
<title>Tabung Family Day</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #1c1c1e;
    --muted: #8a8a8e;
    --line: #e5e5ea;
    --accent: #0a7c66;
    --accent-soft: #dff3ee;
    --gold: #e8a317;
    --red: #d93a30;
    --red-soft: #fbe5e3;
    --bar: rgba(249,249,251,.88);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #98989f; --line: #2c2c2e;
      --accent: #2fc4a5; --accent-soft: #123c34; --gold: #f2b83a; --red: #ff6259; --red-soft: #3d1b19;
      --bar: rgba(28,28,30,.88);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --muted: #98989f; --line: #2c2c2e;
    --accent: #2fc4a5; --accent-soft: #123c34; --gold: #f2b83a; --red: #ff6259; --red-soft: #3d1b19;
    --bar: rgba(28,28,30,.88);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
  main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }

  .nav { display: flex; align-items: center; justify-content: flex-end; min-height: 44px; padding: 0 16px; }
  .nav .link { color: var(--accent); font-size: 17px; padding: 8px 4px; }
  h1.title { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 18px; }

  /* Balance hero */
  .hero { background: var(--accent); color: #fff; border-radius: 22px; padding: 22px 20px 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .hero .lbl { font-size: 15px; opacity: .85; }
  .hero .amt { font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 2px 0 14px; font-variant-numeric: tabular-nums; }
  .hero.neg { background: var(--red); }
  .meter { height: 10px; border-radius: 6px; background: rgba(255,255,255,.28); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: #fff; border-radius: 6px; transition: width .35s ease; }
  .meter-cap { display: flex; justify-content: space-between; font-size: 13px; opacity: .9; margin-top: 8px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 14px; }
  .stat .v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v.in { color: var(--accent); }
  .stat .v.out { color: var(--red); }

  .group-title { color: var(--muted); font-size: 13px; margin: 20px 16px 6px; text-transform: none; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: left; min-height: 56px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; border-top: 1px solid var(--line); }
  .row.plain + .row.plain::before { left: 16px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 16px; color: #fff; }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .money { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .money.in { color: var(--accent); }
  .row .money.out { color: var(--red); }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 1px; }
  .chip.ok { background: var(--accent-soft); color: var(--accent); }
  .chip.due { background: #fff1d6; color: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.due { background: #3b2e0e; color: #f2b83a; } }
  :root[data-theme="dark"] .chip.due { background: #3b2e0e; color: #f2b83a; }

  .empty { text-align: center; color: var(--muted); padding: 44px 24px; }
  .empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 6px; }

  .btn-primary { display: block; width: 100%; background: var(--accent); color: #fff; font-weight: 600; border-radius: 14px; padding: 15px; text-align: center; margin-top: 14px; }
  .btn-plain { display: block; width: 100%; background: var(--card); color: var(--accent); border-radius: 14px; padding: 14px; text-align: center; margin-top: 10px; font-weight: 500; }
  .btn-danger { color: var(--red); }

  /* Tab bar */
  .tabbar { display: flex; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); padding: 6px 8px 8px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 500; padding: 4px 0; min-height: 48px; }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-selected="true"] { color: var(--accent); }

  /* FAB add */
  .fab { position: absolute; right: 18px; bottom: 82px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 5; }
  .fab svg { width: 26px; height: 26px; }
  .fab.hidden { display: none; }

  /* Sheet */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 20px 20px 0 0; z-index: 11; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); max-height: 92%; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .sheet.on { transform: translateY(0); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .sheet-head .cancel { color: var(--accent); padding: 6px 2px; }
  .field { background: var(--card); border-radius: 12px; overflow: hidden; }
  .field label { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 50px; gap: 12px; }
  .field label + label { border-top: 1px solid var(--line); }
  .field span { color: var(--ink); flex: none; }
  .field input, .field select { flex: 1; min-width: 0; text-align: right; background: transparent; border: 0; color: var(--ink); font: inherit; font-size: 17px; padding: 12px 0; outline-offset: 4px; }
  .field input::placeholder { color: var(--muted); }
  .field select { appearance: none; -webkit-appearance: none; }
  .quick { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .quick button { background: var(--card); border-radius: 18px; padding: 8px 14px; font-size: 15px; color: var(--accent); font-weight: 500; }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: rgba(40,40,42,.94); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: .25s; z-index: 20; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="nav"><button class="link" id="navAction" aria-label="Share summary">Share</button></div>
  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="summary" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><circle cx="12" cy="13.5" r="2.5"/></svg>
      Tabung
    </button>
    <button class="tab" role="tab" data-tab="people" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>
      People
    </button>
    <button class="tab" role="tab" data-tab="expenses" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      Expenses
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  var KEY = "tabung-family-day-v1";
  var COLORS = ["#0a7c66", "#e8a317", "#5b6bd6", "#d6577a", "#2f8fc4", "#8a5cc2", "#d9703a", "#4e9a3e"];
  var CATS = ["Food", "Venue", "Transport", "Games & prizes", "Decor", "Other"];

  var state = { title: "Family Day", target: 0, people: [], expenses: [] };
  var tab = "summary";

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.people && s.expenses) state = s; }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function rm(n) { var neg = n < 0; var v = Math.abs(n).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (neg ? "-" : "") + "RM " + v; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function num(v) { var n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtDate(s) { if (!s) return ""; var p = s.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString("en-MY", { day: "numeric", month: "short" }); }

  function totals() {
    var c = state.people.reduce(function (a, p) { return a + p.amount; }, 0);
    var s = state.expenses.reduce(function (a, e) { return a + e.amount; }, 0);
    return { collected: c, spent: s, balance: c - s };
  }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("on"); }, 1800);
  }

  /* ---------- Views ---------- */
  function render() {
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"); });
    $("fab").classList.toggle("hidden", tab === "summary");
    $("fab").setAttribute("aria-label", tab === "people" ? "Add person" : "Add expense");
    $("navAction").style.visibility = tab === "summary" ? "visible" : "hidden";
    var v = $("view");
    v.innerHTML = tab === "summary" ? viewSummary() : tab === "people" ? viewPeople() : viewExpenses();
    bindView();
  }

  function viewSummary() {
    var t = totals();
    var pct = t.collected > 0 ? Math.min(100, Math.round((t.spent / t.collected) * 100)) : 0;
    var neg = t.balance < 0;
    var paidCount = state.people.filter(function (p) { return p.amount > 0; }).length;
    var html = '<h1 class="title">' + esc(state.title) + '</h1>' +
      '<p class="sub">Tabung · ' + state.people.length + ' people, ' + state.expenses.length + ' expenses</p>' +
      '<div class="hero' + (neg ? " neg" : "") + '">' +
        '<div class="lbl">' + (neg ? "Over budget" : "Balance left") + '</div>' +
        '<div class="amt">' + rm(t.balance) + '</div>' +
        '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
        '<div class="meter-cap"><span>' + pct + '% spent</span><span>' + rm(t.collected) + ' collected</span></div>' +
      '</div>' +
      '<div class="pair">' +
        '<div class="stat"><div class="k">Collected</div><div class="v in">' + rm(t.collected) + '</div></div>' +
        '<div class="stat"><div class="k">Spent</div><div class="v out">' + rm(t.spent) + '</div></div>' +
      '</div>';

    // Top contributors / recent expenses
    if (state.expenses.length) {
      var recent = state.expenses.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).slice(0, 3);
      html += '<div class="group-title">Latest expenses</div><div class="list">' + recent.map(function (e) {
        return '<div class="row plain"><div class="main"><div class="name">' + esc(e.title) + '</div><div class="meta">' + esc(e.cat) + ' · ' + fmtDate(e.date) + '</div></div><div class="money out">-' + rm(e.amount) + '</div></div>';
      }).join("") + '</div>';
    }

    if (state.target > 0 && state.people.length) {
      var due = state.people.filter(function (p) { return p.amount < state.target; }).length;
      html += '<div class="group-title">Contribution target</div><div class="list"><div class="row plain"><div class="main"><div class="name">' + rm(state.target) + ' per person</div><div class="meta">' + (due ? due + ' still to pay' : 'Everyone has paid') + '</div></div></div></div>';
    }

    html += '<div class="group-title">Settings</div><div class="list">' +
      '<button class="row plain" data-act="settings"><div class="main"><div class="name">Event name and target</div></div><div class="meta">Edit</div></button>' +
      '<button class="row plain" data-act="theme"><div class="main"><div class="name">Appearance</div></div><div class="meta">' + themeLabel() + '</div></button>' +
      '</div>' +
      '<button class="btn-plain btn-danger" data-act="reset">Clear all data</button>';
    return html;
  }

  function viewPeople() {
    var t = totals();
    var html = '<h1 class="title">People</h1><p class="sub">' + rm(t.collected) + ' collected from ' + state.people.length + ' ' + (state.people.length === 1 ? "person" : "people") + '</p>';
    if (!state.people.length) {
      return html + '<div class="empty"><b>No one has paid yet</b>Tap + to add a family member and the amount they gave.</div>';
    }
    var sorted = state.people.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    html += '<div class="list">' + sorted.map(function (p, i) {
      var idx = state.people.indexOf(p);
      var chip = "";
      if (state.target > 0) {
        chip = p.amount >= state.target ? '<span class="chip ok">Paid</span>' : '<span class="chip due">' + rm(state.target - p.amount) + ' left</span>';
      }
      return '<button class="row" data-person="' + p.id + '">' +
        '<div class="avatar" style="background:' + COLORS[idx % COLORS.length] + '">' + esc(p.name.trim().charAt(0).toUpperCase() || "?") + '</div>' +
        '<div class="main"><div class="name">' + esc(p.name) + chip + '</div><div class="meta">' + (p.note ? esc(p.note) + " · " : "") + fmtDate(p.date) + '</div></div>' +
        '<div class="money in">' + rm(p.amount) + '</div></button>';
    }).join("") + '</div>';
    return html;
  }

  function viewExpenses() {
    var t = totals();
    var html = '<h1 class="title">Expenses</h1><p class="sub">' + rm(t.spent) + ' spent · ' + rm(t.balance) + ' left</p>';
    if (!state.expenses.length) {
      return html + '<div class="empty"><b>No expenses yet</b>Tap + to record food, venue, games or anything paid from the tabung.</div>';
    }
    var sorted = state.expenses.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    html += '<div class="list">' + sorted.map(function (e) {
      return '<button class="row plain" data-expense="' + e.id + '"><div class="main"><div class="name">' + esc(e.title) + '</div><div class="meta">' + esc(e.cat) + ' · ' + fmtDate(e.date) + '</div></div><div class="money out">-' + rm(e.amount) + '</div></button>';
    }).join("") + '</div>';

    // by category
    var by = {};
    state.expenses.forEach(function (e) { by[e.cat] = (by[e.cat] || 0) + e.amount; });
    html += '<div class="group-title">By category</div><div class="list">' + Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }).map(function (k) {
      return '<div class="row plain"><div class="main"><div class="name">' + esc(k) + '</div></div><div class="money">' + rm(by[k]) + '</div></div>';
    }).join("") + '</div>';
    return html;
  }

  function bindView() {
    var v = $("view");
    v.querySelectorAll("[data-person]").forEach(function (b) { b.onclick = function () { openPerson(b.dataset.person); }; });
    v.querySelectorAll("[data-expense]").forEach(function (b) { b.onclick = function () { openExpense(b.dataset.expense); }; });
    v.querySelectorAll("[data-act]").forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === "settings") openSettings();
        else if (a === "theme") cycleTheme();
        else if (a === "reset") openReset();
      };
    });
  }

  /* ---------- Sheets ---------- */
  function openSheet(html) {
    $("sheet").innerHTML = '<div class="grab"></div>' + html;
    $("sheet").classList.add("on"); $("scrim").classList.add("on");
    var first = $("sheet").querySelector("input"); if (first) setTimeout(function () { first.focus(); }, 320);
  }
  function closeSheet() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); if (document.activeElement) document.activeElement.blur(); }
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  function openPerson(id) {
    var p = state.people.find(function (x) { return x.id === id; });
    var isNew = !p;
    p = p || { name: "", amount: "", note: "", date: today() };
    var quick = [10, 20, 50, 100];
    openSheet(
      '<div class="sheet-head"><button class="cancel" id="sCancel">Cancel</button><h2>' + (isNew ? "New contribution" : "Edit person") + '</h2><button class="cancel" id="sSave" style="font-weight:600">' + (isNew ? "Add" : "Save") + '</button></div>' +
      '<div class="field">' +
        '<label><span>Name</span><input id="fName" placeholder="e.g. Pak Long" value="' + esc(p.name) + '" autocomplete="off" autocapitalize="words"></label>' +
        '<label><span>Amount (RM)</span><input id="fAmount" inputmode="decimal" placeholder="0.00" value="' + (p.amount || "") + '"></label>' +
        '<label><span>Note</span><input id="fNote" placeholder="Optional" value="' + esc(p.note || "") + '"></label>' +
        '<label><span>Date</span><input id="fDate" type="date" value="' + esc(p.date || today()) + '"></label>' +
      '</div>' +
      '<div class="quick">' + quick.map(function (q) { return '<button data-add="' + q + '">+' + q + '</button>'; }).join("") + '</div>' +
      (isNew ? "" : '<button class="btn-plain btn-danger" id="sDelete">Remove person</button>')
    );
    $("sCancel").onclick = closeSheet;
    document.querySelectorAll("[data-add]").forEach(function (b) {
      b.onclick = function () { var cur = num($("fAmount").value); $("fAmount").value = (cur + Number(b.dataset.add)).toFixed(2); };
    });
    $("sSave").onclick = function () {
      var name = $("fName").value.trim(), amt = num($("fAmount").value);
      if (!name) { toast("Enter a name"); $("fName").focus(); return; }
      if (!amt) { toast("Enter an amount"); $("fAmount").focus(); return; }
      var rec = { id: isNew ? uid() : id, name: name, amount: amt, note: $("fNote").value.trim(), date: $("fDate").value || today() };
      if (isNew) state.people.push(rec); else state.people[state.people.findIndex(function (x) { return x.id === id; })] = rec;
      save(); closeSheet(); render(); toast(isNew ? "Added " + name : "Saved");
    };
    if (!isNew) $("sDelete").onclick = function () {
      state.people = state.people.filter(function (x) { return x.id !== id; });
      save(); closeSheet(); render(); toast("Person removed");
    };
  }

  function openExpense(id) {
    var e = state.expenses.find(function (x) { return x.id === id; });
    var isNew = !e;
    e = e || { title: "", amount: "", cat: CATS[0], date: today() };
    openSheet(
      '<div class="sheet-head"><button class="cancel" id="sCancel">Cancel</button><h2>' + (isNew ? "New expense" : "Edit expense") + '</h2><button class="cancel" id="sSave" style="font-weight:600">' + (isNew ? "Add" : "Save") + '</button></div>' +
      '<div class="field">' +
        '<label><span>What for</span><input id="fTitle" placeholder="e.g. BBQ catering" value="' + esc(e.title) + '" autocomplete="off"></label>' +
        '<label><span>Amount (RM)</span><input id="fAmount" inputmode="decimal" placeholder="0.00" value="' + (e.amount || "") + '"></label>' +
        '<label><span>Category</span><select id="fCat">' + CATS.map(function (c) { return '<option' + (c === e.cat ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select></label>' +
        '<label><span>Date</span><input id="fDate" type="date" value="' + esc(e.date || today()) + '"></label>' +
      '</div>' +
      (isNew ? "" : '<button class="btn-plain btn-danger" id="sDelete">Delete expense</button>')
    );
    $("sCancel").onclick = closeSheet;
    $("sSave").onclick = function () {
      var title = $("fTitle").value.trim(), amt = num($("fAmount").value);
      if (!title) { toast("Enter what it was for"); $("fTitle").focus(); return; }
      if (!amt) { toast("Enter an amount"); $("fAmount").focus(); return; }
      var rec = { id: isNew ? uid() : id, title: title, amount: amt, cat: $("fCat").value, date: $("fDate").value || today() };
      if (isNew) state.expenses.push(rec); else state.expenses[state.expenses.findIndex(function (x) { return x.id === id; })] = rec;
      save(); closeSheet(); render(); toast(isNew ? "Expense added" : "Saved");
    };
    if (!isNew) $("sDelete").onclick = function () {
      state.expenses = state.expenses.filter(function (x) { return x.id !== id; });
      save(); closeSheet(); render(); toast("Expense deleted");
    };
  }

  function openSettings() {
    openSheet(
      '<div class="sheet-head"><button class="cancel" id="sCancel">Cancel</button><h2>Tabung settings</h2><button class="cancel" id="sSave" style="font-weight:600">Save</button></div>' +
      '<div class="field">' +
        '<label><span>Event name</span><input id="fTitle" value="' + esc(state.title) + '" autocomplete="off"></label>' +
        '<label><span>Target per person</span><input id="fTarget" inputmode="decimal" placeholder="Optional" value="' + (state.target || "") + '"></label>' +
      '</div>'
    );
    $("sCancel").onclick = closeSheet;
    $("sSave").onclick = function () {
      state.title = $("fTitle").value.trim() || "Family Day";
      state.target = num($("fTarget").value);
      save(); closeSheet(); render();
    };
  }

  function openReset() {
    openSheet(
      '<div class="sheet-head"><button class="cancel" id="sCancel">Cancel</button><h2>Clear all data?</h2><span></span></div>' +
      '<p class="sub" style="margin-top:0">This removes every person and expense saved on this device. It cannot be undone.</p>' +
      '<button class="btn-plain btn-danger" id="sConfirm">Clear everything</button>'
    );
    $("sCancel").onclick = closeSheet;
    $("sConfirm").onclick = function () {
      state = { title: "Family Day", target: 0, people: [], expenses: [] };
      save(); closeSheet(); render(); toast("All data cleared");
    };
  }

  /* ---------- Theme ---------- */
  var theme = "auto";
  function themeLabel() { return theme === "auto" ? "Automatic" : theme === "dark" ? "Dark" : "Light"; }
  function applyTheme() {
    var r = document.documentElement;
    if (theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", theme);
    var dark = theme === "dark" || (theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? "#000000" : "#f2f2f7";
  }
  function cycleTheme() {
    theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
    try { localStorage.setItem(KEY + "-theme", theme); } catch (e) {}
    applyTheme(); render();
  }

  /* ---------- Share ---------- */
  function summaryText() {
    var t = totals();
    var lines = [state.title + " – Tabung summary", ""];
    lines.push("Collected: " + rm(t.collected));
    lines.push("Spent: " + rm(t.spent));
    lines.push("Balance: " + rm(t.balance), "");
    if (state.people.length) {
      lines.push("Contributions:");
      state.people.forEach(function (p) { lines.push("- " + p.name + ": " + rm(p.amount)); });
      lines.push("");
    }
    if (state.expenses.length) {
      lines.push("Expenses:");
      state.expenses.forEach(function (e) { lines.push("- " + e.title + " (" + e.cat + "): " + rm(e.amount)); });
    }
    return lines.join("\n");
  }
  function copyText(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  $("navAction").onclick = function () {
    var txt = summaryText();
    if (navigator.share) { navigator.share({ title: state.title, text: txt }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast("Summary copied"); }, function () { toast(copyText(txt) ? "Summary copied" : "Could not copy"); });
    } else { toast(copyText(txt) ? "Summary copied" : "Could not copy"); }
  };

  /* ---------- Wiring ---------- */
  document.querySelectorAll(".tab").forEach(function (b) {
    b.onclick = function () { tab = b.dataset.tab; render(); $("view").scrollTop = 0; };
  });
  $("fab").onclick = function () { if (tab === "people") openPerson(null); else openExpense(null); };

  load();
  try { var th = localStorage.getItem(KEY + "-theme"); if (th) theme = th; } catch (e) {}
  applyTheme();
  render();
})();
</script>
</body>
</html>
